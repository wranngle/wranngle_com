<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>404 Not Found - Wranngle Systems</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #fcfaf5;
        --muted: rgba(252, 250, 245, 0.68);
        --panel: #18181b;
        --edge: rgba(255, 255, 255, 0.12);
        --orange: #ff5f00;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 20% 20%, rgba(255, 95, 0, 0.16), transparent 32rem),
          #12111a;
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      main {
        width: min(100%, 560px);
        padding: 40px;
        border: 1px solid var(--edge);
        border-left: 4px solid var(--orange);
        border-radius: 24px 4px 24px 4px;
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0.01)), var(--panel);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.28);
      }

      .eyebrow {
        margin: 0 0 12px;
        color: var(--orange);
        font-family:
          "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco,
          Consolas, monospace;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 16px;
        font-size: clamp(36px, 9vw, 56px);
        line-height: 0.96;
      }

      p {
        margin: 0 0 28px;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.6;
      }

      a {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        min-height: 44px;
        padding: 12px 18px;
        border-radius: 8px;
        background: var(--orange);
        color: white;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.04em;
        text-decoration: none;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">404 // Not Found</p>
      <h1>That route is not in the stack.</h1>
      <p>
        The page may have moved, or the link may be wrong. Head back to the
        Wranngle Systems home page.
      </p>
      <a href="/">Back to home -></a>
    </main>
  </body>
</html>
