<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!--
      Two theme-color metas so the mobile address-bar tints to match the
      page mode the visitor actually sees. The site supports both modes
      via the in-page DarkModeToggle, but theme-color only honors the OS
      preference media query — not the user's in-page choice. Most
      visitors keep system + site in sync; the edge case (system X,
      toggled Y) gets the system value, which is a reasonable default.
      #fcfaf5 = sand-50 page bg (light); #12111a = night-950 page bg (dark).
    -->
    <meta
      name="theme-color"
      content="#fcfaf5"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#12111a"
      media="(prefers-color-scheme: dark)"
    />

    <!-- SEO & Metadata -->
    <title>
      Wranngle Systems | AI Voice Agents for HVAC, Plumbing & Electrical
    </title>

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Font request tuned to actual usage:
      - Bricolage Grotesque 400-800 (brand-font headers)
      - Inter 400-900 (body + AgentFactsPopout uses font-black=900;
        without 800/900 the popout was rendering synthetic-bold, which
        looks fuzzy on the FDA-nutrition-label spec sheet)
      - JetBrains Mono 400/500/700 (terminal aesthetic)
      DM Sans was being downloaded but never used — Inter sits ahead
      of it in the --font-sans fallback chain, so DM Sans was dead
      weight. Removed.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;500;600;700;800&family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
