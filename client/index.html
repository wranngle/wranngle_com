    <!--
      Two theme-color metas so the mobile address-bar tints to match the
      page mode the visitor actually sees. The site supports both modes
      via the in-page DarkModeToggle, but theme-color only honors the OS
      preference media query — not the user's in-page choice. Most
      visitors keep system + site in sync; the edge case (system X,
      toggled Y) gets the system value, which is a reasonable default.
      #fcfaf5 = sand-50 page bg (light); #12111a = night-950 page bg (dark).
    -->
    <meta
      name="theme-color"
      content="#fcfaf5"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#12111a"
      media="(prefers-color-scheme: dark)"
    />

    <!--
      Theme pre-paint shim. Without this, every page load renders in
      the CSS :root (light) defaults and only flips to .dark after
      React mounts and the useDarkMode hook applies the class — a
      visible flash for every dark-mode visitor. This script reads
      the same localStorage key + system preference the hook uses,
      synchronously sets the class on <html> before stylesheets
      compute, and prevents the flash. Kept inline + tiny so it
      blocks the first paint by single-digit milliseconds at most.
    -->
    <script>
      (function () {
        try {
          var stored =
            window.localStorage && window.localStorage.getItem('wranngle:theme');
          var dark =
            stored === 'dark' ||
            (stored !== 'light' &&
              ((window.matchMedia &&
                window.matchMedia('(prefers-color-scheme: dark)').matches) ||
                stored === null));
          if (dark) document.documentElement.classList.add('dark');
        } catch (_) {
          /* localStorage unavailable; fall through to brand default */
          document.documentElement.classList.add('dark');
        }
      })();
    </script>

    <!-- ?v=3 cache-busts the favicon rebake (80% safe-area rule from
         logo_maker DESIGN.md). Bump the version on every PNG rebake; the
         static file itself keeps its long max-age from _headers. The
         .ico is for legacy lookups (Slack unfurl, Outlook, RSS readers,
         IE/legacy Windows pinning) that probe /favicon.ico at the root. -->
    <link rel="icon" type="image/x-icon" sizes="32x32" href="/favicon.ico?v=3" />
    <link rel="icon" type="image/png" href="/favicon.png?v=3" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png?v=3"
    />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://unpkg.com" crossorigin />
    <!--
      Font request tuned to actual usage:
      - Bricolage Grotesque 400-800 (brand-font headers)
      - Inter 400-900 (body + AgentFactsPopout uses font-black=900;
        without 800/900 the popout was rendering synthetic-bold, which
        looks fuzzy on the FDA-nutrition-label spec sheet)
      - JetBrains Mono 400/500/700 (terminal aesthetic)
      DM Sans was being downloaded but never used — Inter sits ahead
      of it in the --font-sans fallback chain, so DM Sans was dead
      weight. Removed.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;500;600;700;800&family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
