name: scorecard

# OSSF Scorecard publishing requires its workflow file to have NO top-level
# `env:` or `defaults:` block (workflow-restriction enforced by the action's
# webapp). Keeping scorecard isolated in its own file lets security.yml keep
# its `ACTIONLINT_VERSION` / `ZIZMOR_VERSION` env vars without breaking
# scorecard publication.
# https://github.com/ossf/scorecard-action#workflow-restrictions

on:
  push:
    branches: [main, master]
  schedule:
    - cron: "23 11 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scorecard:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && (github.event.repository.private == false || vars.ENABLE_SCORECARD == 'true')
    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a  # v2.4.3
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: ${{ github.event.repository.private == false && github.ref_name == github.event.repository.default_branch }}
      - name: Upload Scorecard SARIF
        if: always() && hashFiles('scorecard.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@e46ed2cbd01164d986452f91f178727624ae40d7  # v4
        with:
          sarif_file: scorecard.sarif
