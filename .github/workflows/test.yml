name: test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7  # v1
        with:
          bun-version: '1.1'
      - name: Install dependencies
        run: bun install
      - name: Typecheck (tsc)
        run: bun run check
      - name: Lint (xo)
        run: bun run lint
      - name: Lint — no new @ts-nocheck (regression guard)
        run: bash scripts/bin/lint-no-new-ts-nocheck.sh
        env:
          BASE_REF: origin/${{ github.base_ref || 'main' }}
      - name: Build (vite + workers)
        run: bun run build
      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
