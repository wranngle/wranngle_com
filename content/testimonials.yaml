# Testimonial manifest.
#
# Source of truth for the state/ZIP-filterable testimonial grid rendered
# by client/src/components/TestimonialGrid.tsx. The runtime registry
# lives at client/src/data/testimonials.ts and MUST match this file
# row-for-row; tests/e2e/testimonials.test.tsx asserts the drift contract
# and the CA-only filter promise from round-2 §6 item-4.
#
# Editor workflow:
#   1. Edit this YAML.
#   2. Mirror the change into client/src/data/testimonials.ts (same field
#      names, same values, same order).
#   3. Run `bun run test:run tests/e2e/testimonials.test.tsx` — the
#      drift + filter test fails loudly if either file disagrees.
#
# Sibling above-fold story surface to the round-1 case-study video hero
# (#77): both live in the homepage proof band, both attach to a specific
# regional/vertical signal so prospects see themselves in the source.
#
# Fields:
#   id          — stable slug, also used as React key.
#   name        — speaker's name (first name + last initial is fine).
#   role        — speaker's job title at the business.
#   businessName — the trades business they run.
#   state       — 2-letter USPS state code (uppercase). Filter axis.
#   zip         — 5-digit ZIP. Filter axis (prefix-match supported).
#   vertical    — plumbers | hvac | electricians | other. Optional UI badge.
#   quote       — body copy (1–3 sentences). No surrounding quotes.

testimonials:
